# ============================================================================
# LuckPerms permission model -- applied on every `docker compose up`.
# ============================================================================
#
# THIS FILE IS AUTHORITATIVE for the groups and tracks it names. Each managed
# group's node set is REPLACED wholesale on every deployment, and each managed
# track's ladder is replaced in full and in order, so changes made to them
# through the LuckPerms web editor WILL BE OVERWRITTEN.
#
# Because replacement is wholesale, deleting a permission here DELETES that
# node on the next deployment. Commenting out a block to "temporarily disable"
# it is a destructive edit, not an inert one.
#
# Groups NOT listed here are never touched. Create an unlisted group if you
# need somewhere to make ad-hoc runtime grants -- but give it a weight above
# any managed group that denies the same key. LuckPerms walks a user's parent
# groups highest-weight-first and keeps the FIRST value it finds, so a weight-0
# ad-hoc grant of `irc.server.survival` loses to onboarder's explicit deny at
# weight 10, silently. Measured against this API: weight 0 resolves false,
# weight 11 resolves true.
#
# ---------------------------------------------------------------------------
# MCHPRS constraints -- read before adding permissions
# ---------------------------------------------------------------------------
# MCHPRS reads this data straight out of the database rather than running the
# LuckPerms plugin, and its implementation is limited in three ways:
#
#   1. NEVER write a node that is a strict prefix of another node MCHPRS will
#      query. Its matcher indexes the stored path while iterating the queried
#      string's segments, so a stored `mchprs.command` checked against a
#      queried `mchprs.command.foo` panics with an index-out-of-bounds.
#      Use exact keys or an explicit `*` wildcard -- never a partial path.
#   2. Only `global` and `mchprs` server contexts are visible to it.
#   3. Group membership must be an explicit `group.<name>` node on the user.
#      MCHPRS never consults the primary-group table. That matters because
#      LuckPerms does not persist a user whose only membership is the
#      `default` group it assigns automatically: such a player gets a row in
#      `luckperms_players` and NO rows at all in `luckperms_user_permissions`,
#      so MCHPRS sees them in no group. Measured -- and note that the REST API
#      reports `group.default` on that same player, so the API view is not
#      evidence the node is stored. A `group.default` row does appear once the
#      player has some other stored node, and disappears again when it goes.
#      Grant membership with `lp user <name> parent add <group>`, which writes
#      the `group.<name>` node MCHPRS looks for.
#
# ---------------------------------------------------------------------------
# Syntax
# ---------------------------------------------------------------------------
# Under `groups:`, each group takes:
#   weight:          integer; higher wins for prefix and meta resolution, and
#                    orders a user's parent groups as described above
#   prefix:          chat prefix
#   prefix_priority: overrides the prefix priority; defaults to the weight
#   inherits:        list of parent group names
#   permissions:     either a bare string (granted globally), or a mapping with
#                    key, optional value (false negates), optional context,
#                    and optional expiry (epoch seconds)
#
# Do NOT put an `expiry` on a group node here. A lapsed expiry IS written to
# storage by the write, and is then deleted the first time the group is read
# back -- LuckPerms audits expired nodes on load. So the seeder finds it gone
# on the next run, writes it again, and reports a change on every deployment
# forever. A future expiry is stored and survives, but that only postpones
# the loop until it lapses. Expiries belong on users, granted at runtime.
# (Measured against this API.)
#
# Under `tracks:`, each track takes:
#   groups:          the promotion ladder, in order, lowest rung first
# ============================================================================

groups:
  # Everyone starts here. LuckPerms assigns `default` automatically.
  default:
    weight: 0
    inherits:
      - onboarder

  # A new player who has not yet been vouched for. INTENDED to be confined to
  # the onboarding server -- but nothing reads `irc.server.*` yet. Velocity's
  # own /server command checks `velocity.command.server` alone and treats
  # undefined as permitted; confining a player to one backend needs a plugin
  # listening on ServerPreConnectEvent, and none is installed. These nodes are
  # the right shape for that gate and are inert until it exists.
  onboarder:
    weight: 10
    prefix: "&7[New] "
    permissions:
      - key: "irc.server.onboarding"
        value: true
      # Explicitly denied elsewhere so the deny is visible in the model
      # rather than implied by absence.
      - key: "irc.server.survival"
        value: false
      - key: "irc.server.project"
        value: false

  # A vouched member with normal play access. The two grants below re-grant
  # what onboarder denies: a group's own node beats one inherited from a
  # parent, so this resolves true for a member. Verified against this API.
  member:
    weight: 100
    prefix: "&a[Member] "
    inherits:
      - onboarder
    permissions:
      - key: "irc.server.survival"
        value: true
      - key: "irc.server.project"
        value: true
      # Wildcard, not a partial path -- see the MCHPRS constraints above.
      - key: "mchprs.command.*"
        value: true
        context:
          server: mchprs

  # Staff. Administrative control over LuckPerms, the vanilla commands and
  # MCHPRS -- deliberately not a blanket `*`.
  admin:
    weight: 1000
    prefix: "&c[Admin] "
    inherits:
      - member
    permissions:
      - "luckperms.*"
      - "minecraft.command.*"
      - key: "mchprs.admin.*"
        value: true
        context:
          server: mchprs

tracks:
  # Promotion path: lp user <name> promote onboarding
  #
  # Two things to know before using it. A new player already carries
  # onboarder's nodes through `default`, so the first promote grants nothing
  # new and reaching `member` takes two -- though it does give them their
  # first stored nodes, which is what makes them visible to MCHPRS at all
  # (constraint 3). And the ladder ends at `admin`, so one promote too many
  # makes a player staff.
  onboarding:
    groups:
      - onboarder
      - member
      - admin
