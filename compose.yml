name: irc-minecraft
services:
  # Volume setup service to initialize shared storage with proper subdirectories and permissions
  # ! Any service that depends on the "managed-files" volume should depend on this service to ensure the directory structure is created before they start
  volume_init:
    container_name: volume-init
    image: alpine
    volumes:
      - managed-files:/mnt/data
    # Creates the per-server subdirectories, then hands the whole tree to uid
    # 1000 and removes access for everyone else.
    #
    # This replaced a blanket `chmod -R 777`. Every service that touches this
    # volume ends up running as uid 1000 -- the five Minecraft servers and
    # velocity via their itzg base images, webdav via `user: 1000:1000`, and
    # mchprs via the `user:` key on its own service. (The itzg entrypoints do
    # run a brief root phase before dropping privileges, but it copies files
    # that are already owned by 1000 at build time, so it leaves nothing
    # root-owned. Measured across full restarts: 0 files outside uid 1000.)
    # Because the uid is uniform, none of them needs group or other permission
    # to read or write what another wrote, so removing "other" costs nothing
    # and a stray container running as some other uid cannot write here.
    # backup and this container run as root and are unaffected, since root
    # bypasses the mode bits.
    #
    # What this does and does NOT guarantee, measured rather than assumed:
    #
    #   Durable:     nothing in the volume is world-WRITABLE. That is the
    #                property worth having and it holds across restarts.
    #   NOT durable: `o=` is applied once, here, at init. Service entrypoints
    #                then `cp -a` files in from their images, which restores
    #                the image mode -- usually 0644 -- and server processes
    #                create files under their own umask. Measured after a full
    #                restart: 101 world-READABLE files, all owned by 1000.
    #
    # So do not read `o=` as "nothing here is readable by another uid". If a
    # file in this volume must stay unreadable, the service that writes it has
    # to set its mode; this container cannot hold that for it. The live case
    # is velocity/forwarding.secret, which returns to 0644 on every velocity
    # start because src/velocity/entrypoint.sh copies it with `cp -a`.
    #
    # Do NOT drop the `user:` key from mchprs without putting the 777 back.
    # mchprs is the one service whose image runs as root by default; if it
    # writes /data as root again, WebDAV (uid 1000) can no longer edit any
    # mchprs file, which is the whole point of exposing the volume over WebDAV.
    #
    # capital X in the mode sets execute on directories, and on files that
    # already had it, rather than marking every file +x. Verified on this tree:
    # the Fabric jars stay -rw-rw---- while 305 already-executable files keep
    # it. Measured cost of the recursive pass: 2142 inodes, under a second.
    #
    # Migrating an EXISTING deployment has one ordering hazard: a service
    # still running as root can flush state to disk after this container has
    # already chowned the tree, leaving files uid 1000 cannot write. Hit once,
    # by mchprs writing a plot on shutdown. A normal `up` is unaffected, since
    # this runs to completion before any server starts. To heal it, stop the
    # offending service and recreate this one.
    command: >
      sh -c "mkdir -p /mnt/data/velocity /mnt/data/lobby /mnt/data/survival
      /mnt/data/onboarding /mnt/data/mchprs /mnt/data/project-0
      /mnt/data/project-1 && 
         chown -R 1000:1000 /mnt/data &&
         chmod -R u=rwX,g=rwX,o= /mnt/data"

  # Daily backup service that creates compressed archives of all managed volumes and uploads them to S3-compatible storage
  backup:
    container_name: backup
    image: offen/docker-volume-backup:latest
    restart: unless-stopped
    env_file:
      - path: backup.config
        required: false
    volumes:
      - type: volume
        source: managed-files
        target: /backup/survival
        volume:
          subpath: survival
      - type: volume
        source: managed-files
        target: /backup/project-0
        volume:
          subpath: project-0
      - type: volume
        source: managed-files
        target: /backup/project-1
        volume:
          subpath: project-1
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker socket needed to stop/start containers during backup
    networks:
      - minecraft-network
    depends_on:
      volume_init:
        condition: service_completed_successfully

  # MariaDB database for luckperms player permissions
  luckperms-db:
    image: mariadb:11.4
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
    container_name: luckperms-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${LUCKPERMS_DB_ROOT_PASSWORD:-rootpassword}
      - MARIADB_USER=${LUCKPERMS_DB_USER:-luckperms_user}
      - MARIADB_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}
      - MARIADB_DATABASE=${LUCKPERMS_DB:-luckperms}
    volumes:
      - luckperms-db-data:/var/lib/mysql
    networks:
      - minecraft-network

  # Standalone luckperms instance with rest api
  luckperms-standalone:
    build:
      context: ./src/luckperms-standalone
    healthcheck:
      # The base image's inherited check greps for '"up":true', but this version
      # reports {"healthy":true,...}. The inherited check can NEVER pass, so this
      # must be overridden rather than removed. Matching the body rather than just
      # the status code also proves storage connectivity, not merely liveness.
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3001/health | grep -q '\"healthy\":true'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    container_name: luckperms-standalone
    restart: unless-stopped
    environment:
      # configure the LuckPerms standalone "plugin"
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # configure the LuckPerms messaging service
      - LUCKPERMS_MESSAGING_SERVICE=sql

      # configure the REST API
      - LUCKPERMS_REST_HTTP_PORT=8080
      - LUCKPERMS_REST_AUTH=true
      - LUCKPERMS_REST_AUTH_KEYS=${LUCKPERMS_SECRET:-luckpermssecret}
    networks:
      - minecraft-network
      - frontend-network
    depends_on:
      luckperms-db:
        condition: service_healthy

  # One-shot: applies src/luckperms-init/permissions.yml through the REST API.
  # Runs on every `up`; idempotent, and reports changed=0 when already correct.
  #
  # Nothing depends_on this service, deliberately. Gating the game servers on
  # service_completed_successfully would turn a seeding failure into a total
  # outage. The trade is that `docker compose up -d` reports success even when
  # the seeder exits 1, so check its exit code separately rather than reading
  # a green compose run as proof the model applied.
  luckperms-init:
    build:
      context: ./src/luckperms-init
    container_name: luckperms-init
    restart: "no"
    environment:
      - LUCKPERMS_API_URL=http://luckperms-standalone:8080
      - LUCKPERMS_SECRET=${LUCKPERMS_SECRET:-luckpermssecret}
      - PERMISSIONS_FILE=/permissions.yml
    volumes:
      - ./src/luckperms-init/permissions.yml:/permissions.yml:ro
    networks:
      - frontend-network
    depends_on:
      luckperms-standalone:
        condition: service_healthy

  # WebDAV interface over the shared server-data volume.
  # Single service account by design -- see src/webdav/config.yml.
  webdav:
    # Pinned, not :latest -- this is the one service reachable from the
    # internet through the tunnel, so an unreviewed image must not land here
    # on the next pull.
    image: ghcr.io/hacdias/webdav:v5.16.0
    container_name: webdav
    restart: unless-stopped
    command: ["-c", "/config.yml"]
    # Both Minecraft base images run as uid 1000. Matching it means files
    # created through WebDAV stay rewritable by the servers, and vice versa.
    # The image is FROM scratch and binds an unprivileged port, so it needs
    # no root. Directory traversal comes from ownership: volume_init hands the
    # whole tree to uid 1000, so matching that uid is what grants access. It
    # used to come from a blanket chmod 777, which is gone.
    user: "1000:1000"
    environment:
      - WEBDAV_USERNAME=${WEBDAV_USERNAME:?WEBDAV_USERNAME must be set in .env}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:?WEBDAV_PASSWORD must be set in .env}
    volumes:
      - ./src/webdav/config.yml:/config.yml:ro
      - type: volume
        source: managed-files
        target: /data
    networks:
      - frontend-network
    depends_on:
      volume_init:
        condition: service_completed_successfully

  # Internal path router between the tunnel and the admin services.
  caddy:
    # Pinned for the same reason webdav is: this sits directly in the
    # request path from the internet.
    image: caddy:2.11.4-alpine
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./src/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - frontend-network
    depends_on:
      # webdav has no healthcheck by design (FROM scratch: no shell, no HTTP
      # client), so it can only be waited on for start. luckperms-standalone
      # does have one, so gate on it -- consistent with how the rest of this
      # file treats health-gated dependencies.
      webdav:
        condition: service_started
      luckperms-standalone:
        condition: service_healthy

  # Cloudflare tunnel. Token auth means the tunnel is REMOTELY managed: a local
  # config.yml with ingress rules would be silently ignored. That is fine here
  # because Caddy does all routing, so the dashboard needs exactly one public
  # hostname: mc-admin.illiniredstone.org -> http://caddy:80
  cloudflared:
    # Pinned like caddy and webdav: this terminates the public entrypoint.
    image: cloudflare/cloudflared:2026.9.1
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set in .env}
    networks:
      - frontend-network
    depends_on:
      - caddy

  # Proxy for Minecraft servers
  velocity:
    build:
      context: ./src/velocity
    container_name: velocity
    restart: unless-stopped
    ports:
      - 25565:25565
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    volumes:
      - type: volume
        source: managed-files
        target: /server
        volume:
          subpath: velocity
    networks:
      - minecraft-network
    depends_on:
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  # ! ALL MINECRAFT SERVERS SHOULD BE ADDED BELOW THIS LINE

  lobby:
    build:
      context: ./src/lobby
    container_name: lobby-server
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: lobby
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  survival:
    build:
      context: ./src/survival
    container_name: survival-server
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: survival
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  onboarding:
    build:
      context: ./src/onboarding
    container_name: onboarding-server
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: onboarding
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  mchprs:
    build:
      context: ./src/mchprs
    container_name: mchprs-server
    # This image runs as root, and so, without this key, writes /data as uid 0
    # -- after which WebDAV, which runs as 1000, cannot modify a single mchprs
    # file unless the whole volume is world-writable. Pinning it to 1000 is
    # what lets volume_init drop the blanket 777.
    #
    # It runs as root because src/mchprs/Dockerfile is FROM alpine:latest and
    # declares no USER -- NOT because stackdoubleflow/mchprs does. That image
    # appears only as a `COPY --from=` source, and COPY --from= takes files;
    # it never inherits the source image's USER. An earlier version of this
    # comment blamed the upstream image, which is the same welding-two-facts-
    # into-a-cause mistake AGENTS.md item 2 exists to warn about.
    #
    # Verified against the built image: /mchprs is 0755 so uid 1000 can
    # execute it, /etc/mchprs/Config.toml is world-readable so the entrypoint
    # can still copy the template, and the entrypoint writes only into /data.
    user: "1000:1000"
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: mchprs
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_DATA_ADDRESS=luckperms-db
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  # ! ALL PROJECT SERVERS SHOULD BE ADDED BELOW THIS LINE

  project-0:
    build:
      context: ./src/project-0
    container_name: project-0-server
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: project-0
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  project-1:
    build:
      context: ./src/project-1
    container_name: project-1-server
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: project-1
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

# Persistent volumes for data storage
volumes:
  managed-files:
    driver: local
  luckperms-db-data:
    driver: local

# Custom network for service communication
networks:
  minecraft-network:
    driver: bridge
    name: irc-minecraft-network
  frontend-network:
    driver: bridge
    name: irc-frontend-network
