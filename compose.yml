name: irc-minecraft
services:
  # Volume setup service to initialize shared storage with proper subdirectories and permissions
  # ! Any service that depends on the "managed-files" volume should depend on this service to ensure the directory structure is created before they start
  volume_init:
    container_name: volume-init
    image: alpine:3.24
    volumes:
      - managed-files:/mnt/data
    # Creates the per-server subdirectories, hands the whole tree to uid 1000,
    # and removes access for every other uid. This replaced a blanket
    # `chmod -R 777`.
    #
    # WHY THIS SHAPE, and what breaks if you simplify it: AGENTS.md item 6.
    # Read that before editing this command or before dropping the `user:` key
    # from the mchprs service -- the two are one mechanism, not two choices.
    #
    # Four details that are easy to get wrong right here:
    #
    # `o=` removes access for other UIDS. It is NOT a promise that nothing in
    # the volume is world-readable: entrypoints `cp -a` image files back in
    # afterwards and restore their modes. AGENTS.md item 6 has the numbers.
    #
    # `g=rwX` is kept on purpose even though uniform ownership means nothing
    # needs it today. It is the escape hatch for a service that later has to
    # run under a different uid but can join gid 1000. Tighten to `g=` only
    # once that is ruled out.
    #
    # capital X sets execute on directories, and on files that already had it,
    # rather than marking every file +x -- which is why this is not plain
    # `u=rw,g=rw`, since directories still need traversal. Modes in the tree
    # are mixed as a result: most jars land 660, the ones that shipped
    # executable stay 770. Counts are deliberately not quoted here; they move
    # with every mod bump.
    #
    # Self-healing, which is the strongest property this has: it runs on every
    # `up`, ahead of every server via
    # `volume_init: condition: service_completed_successfully`, so a root-owned
    # file that drifts in is chowned back rather than accumulating. It does not
    # merely prevent drift, it repairs it. Measured ~2150 inodes in 0.31s, so
    # the recursive pass costs nothing worth optimising. The `&&` chain also
    # means a failed chown aborts before the chmod and blocks every dependent,
    # which is right for a permissions migration: a half-migrated tree should
    # not boot servers.
    #
    # Migration hazard, hit once: a service still running as root can flush
    # state to disk AFTER this container has chowned the tree. The symptom is
    # not a crash, which is what makes it worth writing down -- mchprs panicked
    # its plot thread with PermissionDenied (plot/mod.rs:1192) and kept serving,
    # silently losing every plot save. Detect with:
    #   docker run --rm -v irc-minecraft_managed-files:/m alpine find /m ! -user 1000
    # Heal by stopping the offending service and recreating this one.
    command: >
      sh -c "mkdir -p /mnt/data/velocity /mnt/data/lobby /mnt/data/survival
      /mnt/data/onboarding /mnt/data/mchprs /mnt/data/project-0
      /mnt/data/project-1 && 
         chown -R 1000:1000 /mnt/data &&
         chmod -R u=rwX,g=rwX,o= /mnt/data"

  # Backup service: compressed archives of the volumes that hold durable state,
  # uploaded to S3-compatible storage.
  #
  # OPT-IN, and deliberately so. With no backup.config and no storage backend this
  # service is NOT inert: offen/docker-volume-backup defaults to @daily and would
  # schedule a run with nowhere to write, while the stop-during-backup labels below
  # let it stop every server. `profiles` keeps it out of a bare `up -d` until a
  # backend is actually configured. Start it with:
  #   docker compose --profile backup up -d
  backup:
    profiles: [backup]
    container_name: backup
    image: offen/docker-volume-backup:v2
    restart: unless-stopped
    env_file:
      - path: backup.config
        required: false
    volumes:
      - type: volume
        source: managed-files
        target: /backup/survival
        volume:
          subpath: survival
      - type: volume
        source: managed-files
        target: /backup/project-0
        volume:
          subpath: project-0
      - type: volume
        source: managed-files
        target: /backup/project-1
        volume:
          subpath: project-1
      # mchprs holds player-built redstone: world/plots.db, world/plots,
      # world/players and schems. That is durable state and exists only here --
      # not in git and not in any image. See AGENTS.md item 5.
      - type: volume
        source: managed-files
        target: /backup/mchprs
        volume:
          subpath: mchprs
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker socket needed to stop/start containers during backup
    networks:
      - minecraft-network
    depends_on:
      volume_init:
        condition: service_completed_successfully

  # MariaDB database for luckperms player permissions
  luckperms-db:
    image: mariadb:11.4
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
    container_name: luckperms-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${LUCKPERMS_DB_ROOT_PASSWORD:-rootpassword}
      - MARIADB_USER=${LUCKPERMS_DB_USER:-luckperms_user}
      - MARIADB_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}
      - MARIADB_DATABASE=${LUCKPERMS_DB:-luckperms}
    volumes:
      - luckperms-db-data:/var/lib/mysql
    networks:
      - minecraft-network

  # Standalone luckperms instance with rest api
  luckperms-standalone:
    build:
      context: ./src/luckperms-standalone
    healthcheck:
      # The base image's inherited check greps for '"up":true', but this version
      # reports {"healthy":true,...}. The inherited check can NEVER pass, so this
      # must be overridden rather than removed. Matching the body rather than just
      # the status code also proves storage connectivity, not merely liveness.
      test:
        [
          "CMD-SHELL",
          'wget -q -O - http://localhost:3001/health | grep -q ''"healthy":true''',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    container_name: luckperms-standalone
    restart: unless-stopped
    environment:
      # configure the LuckPerms standalone "plugin"
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # configure the LuckPerms messaging service
      - LUCKPERMS_MESSAGING_SERVICE=sql

      # configure the REST API
      - LUCKPERMS_REST_HTTP_PORT=8080
      - LUCKPERMS_REST_AUTH=true
      - LUCKPERMS_REST_AUTH_KEYS=${LUCKPERMS_SECRET:?LUCKPERMS_SECRET must be set in .env}
    networks:
      - minecraft-network
      - frontend-network
    depends_on:
      luckperms-db:
        condition: service_healthy

  # One-shot: applies src/luckperms-init/permissions.yml through the REST API.
  # Runs on every `up`; idempotent, and reports changed=0 when already correct.
  #
  # Nothing depends_on this service, deliberately. Gating the game servers on
  # service_completed_successfully would turn a seeding failure into a total
  # outage. The trade is that `docker compose up -d` reports success even when
  # the seeder exits 1, so check its exit code separately rather than reading
  # a green compose run as proof the model applied.
  luckperms-init:
    build:
      context: ./src/luckperms-init
    container_name: luckperms-init
    restart: "no"
    environment:
      - LUCKPERMS_API_URL=http://luckperms-standalone:8080
      - LUCKPERMS_SECRET=${LUCKPERMS_SECRET:?LUCKPERMS_SECRET must be set in .env}
      - PERMISSIONS_FILE=/permissions.yml
    volumes:
      - ./src/luckperms-init/permissions.yml:/permissions.yml:ro
    networks:
      - frontend-network
    depends_on:
      luckperms-standalone:
        condition: service_healthy

  # WebDAV interface over the shared server-data volume.
  # Single service account by design -- see src/webdav/config.yml.
  webdav:
    image: ghcr.io/hacdias/webdav:v5.16.0
    container_name: webdav
    restart: unless-stopped
    command: ["-c", "/config.yml"]
    # Both Minecraft base images run as uid 1000. Matching it means files
    # created through WebDAV stay rewritable by the servers, and vice versa.
    # The image is FROM scratch and binds an unprivileged port, so it needs
    # no root. Directory traversal comes from ownership, not from a mode:
    # volume_init hands the whole tree to uid 1000, so matching that uid is
    # what grants access. AGENTS.md item 6 has the mechanism.
    user: "1000:1000"
    environment:
      - WEBDAV_USERNAME=${WEBDAV_USERNAME:?WEBDAV_USERNAME must be set in .env}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:?WEBDAV_PASSWORD must be set in .env}
    volumes:
      - ./src/webdav/config.yml:/config.yml:ro
      - type: volume
        source: managed-files
        target: /data
    networks:
      - frontend-network
    depends_on:
      volume_init:
        condition: service_completed_successfully

  # Internal path router between the tunnel and the admin services.
  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./src/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - frontend-network
    depends_on:
      # webdav has no healthcheck by design (FROM scratch: no shell, no HTTP
      # client), so it can only be waited on for start.
      webdav:
        condition: service_started
      luckperms-standalone:
        condition: service_healthy

  # Cloudflare tunnel. Token auth means the tunnel is REMOTELY managed: a local
  # config.yml with ingress rules would be silently ignored. That is fine here
  # because Caddy does all routing, so the dashboard needs exactly one public
  # hostname: mc-admin.illiniredstone.org -> http://caddy:80
  cloudflared:
    # Pinned like caddy and webdav: this terminates the public entrypoint.
    image: cloudflare/cloudflared:2026.9.1
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set in .env}
    networks:
      - frontend-network
    depends_on:
      - caddy

  # Proxy for Minecraft servers
  velocity:
    build:
      context: ./src/velocity
    container_name: velocity
    restart: unless-stopped
    ports:
      - 25565:25565
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    volumes:
      - type: volume
        source: managed-files
        target: /server
        volume:
          subpath: velocity
    networks:
      - minecraft-network
    depends_on:
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  # ! ALL MINECRAFT SERVERS SHOULD BE ADDED BELOW THIS LINE

  lobby:
    build:
      context: ./src/lobby
    container_name: lobby-server
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: lobby
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  survival:
    build:
      context: ./src/survival
    container_name: survival-server
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: survival
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  onboarding:
    build:
      context: ./src/onboarding
    container_name: onboarding-server
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: onboarding
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  mchprs:
    build:
      context: ./src/mchprs
    container_name: mchprs-server
    # LOAD-BEARING -- see AGENTS.md item 6 before removing. This image runs as
    # root (alpine base, no USER), so without this key it writes /data as uid 0
    # and WebDAV, which runs as 1000, can no longer edit any mchprs file.
    user: "1000:1000"
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: mchprs
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_DATA_ADDRESS=luckperms-db
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  # ! ALL PROJECT SERVERS SHOULD BE ADDED BELOW THIS LINE

  project-0:
    build:
      context: ./src/project-0
    container_name: project-0-server
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: project-0
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

  project-1:
    build:
      context: ./src/project-1
    container_name: project-1-server
    volumes:
      - type: volume
        source: managed-files
        target: /data
        volume:
          subpath: project-1
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xmx2G -Xms1G}
      - VELOCITY_SECRET=${VELOCITY_SECRET:-velocitysecret}

      # Luckperms database configuration
      - LUCKPERMS_STORAGE_METHOD=mariadb
      - LUCKPERMS_DATA_ADDRESS=luckperms-db:3306
      - LUCKPERMS_DATA_DATABASE=${LUCKPERMS_DB:-luckperms}
      - LUCKPERMS_DATA_USERNAME=${LUCKPERMS_DB_USER:-luckperms_user}
      - LUCKPERMS_DATA_PASSWORD=${LUCKPERMS_DB_PASSWORD:-luckperms_password}

      # Luckperms messaging service configuration
      - LUCKPERMS_MESSAGING_SERVICE=sql
    labels:
      - docker-volume-backup.stop-during-backup=true
    networks:
      - minecraft-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      luckperms-db:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

# Persistent volumes for data storage
volumes:
  managed-files:
    driver: local
  luckperms-db-data:
    driver: local

# Custom network for service communication
networks:
  minecraft-network:
    driver: bridge
    name: irc-minecraft-network
  frontend-network:
    driver: bridge
    name: irc-frontend-network
